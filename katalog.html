<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do'kon Katalogi</title>
<style>
  :root {
    --red: #C0392B; --red-dark: #922B21;
    --gold: #D4AC0D; --bg: #FAFAF8; --card-bg: #fff;
    --text: #1a1a1a; --muted: #666; --border: #E8E4DF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

  header { background: var(--red); color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .header-inner { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .store-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .store-name small { font-size: 11px; opacity: 0.8; font-weight: 400; }
  .header-search { flex: 1; max-width: 280px; position: relative; }
  .header-search input { width: 100%; padding: 8px 14px 8px 34px; border-radius: 20px; border: none; font-size: 14px; font-family: inherit; background: rgba(255,255,255,0.2); color: white; outline: none; }
  .header-search input::placeholder { color: rgba(255,255,255,0.65); }
  .header-search input:focus { background: rgba(255,255,255,0.3); }
  .s-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }
  .cart-btn { background: white; color: var(--red); border: none; border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; }
  .badge { background: var(--red); color: white; border-radius: 50%; min-width: 18px; height: 18px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 3px; }

  .cats-bar { background: white; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cats-bar::-webkit-scrollbar { display: none; }
  .cats-inner { padding: 0 14px; display: flex; gap: 2px; }
  .cat-btn { padding: 11px 13px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; color: var(--muted); white-space: nowrap; }
  .cat-btn.active { color: var(--red); border-bottom-color: var(--red); }

  main { padding: 20px 14px 80px; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 500px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; background: #f5f2ee; display: flex; align-items: center; justify-content: center; font-size: 52px; overflow: hidden; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .tag { position: absolute; top: 7px; left: 7px; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px; z-index: 1; }
  .tag-hot { background: var(--red); color: white; }
  .tag-new { background: #1a6b3c; color: white; }
  .tag-sale { background: var(--gold); color: #2a2000; }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-weight: 600; font-size: 13px; line-height: 1.3; margin-bottom: 2px; }
  .card-unit { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .price { font-weight: 700; font-size: 14px; color: var(--red); }
  .old-price { font-size: 11px; color: #aaa; text-decoration: line-through; display: block; }
  .add-btn { width: 30px; height: 30px; background: var(--red); color: white; border: none; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .add-btn.in-cart { background: #1a6b3c; }

  .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; }
  .cart-overlay.open { display: block; }
  .cart-panel { position: fixed; bottom: -100%; left: 0; right: 0; max-height: 85vh; background: white; z-index: 201; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; transition: bottom 0.3s ease; box-shadow: 0 -4px 24px rgba(0,0,0,0.12); }
  .cart-panel.open { bottom: 0; }
  .cart-drag { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
  .cart-header { padding: 12px 18px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .cart-header h2 { font-size: 16px; font-weight: 700; }
  .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0; line-height: 1; }
  .cart-items { overflow-y: auto; padding: 12px 18px; flex: 1; -webkit-overflow-scrolling: touch; }
  .cart-empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }
  .cart-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ci-thumb { width: 42px; height: 42px; border-radius: 8px; background: #f5f2ee; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden; }
  .ci-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ci-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ci-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .qty-btn { width: 28px; height: 28px; border: 1px solid var(--border); background: var(--bg); border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
  .qty-num { font-size: 14px; font-weight: 700; min-width: 22px; text-align: center; }
  .cart-footer { padding: 12px 18px 28px; border-top: 1px solid var(--border); }
  .note-input { width: 100%; margin-bottom: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; background: var(--bg); resize: none; outline: none; }
  .cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cart-total-label { font-size: 14px; color: var(--muted); }
  .cart-total-amount { font-size: 20px; font-weight: 700; color: var(--red); }
  .order-btn { width: 100%; padding: 14px; background: #0088cc; color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .empty-state { grid-column: 1/-1; text-align: center; padding: 50px 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="store-name">🇰🇷 HanFood Market <small>• Koreya oziq-ovqati</small></div>
    <button class="cart-btn" onclick="openCart()">🛒 Savat <span class="badge" id="cart-count">0</span></button>
  </div>
  <div style="padding: 0 14px 12px; position: relative;">
    <span class="s-icon">🔍</span>
    <input type="search" id="search" placeholder="Qidirish..." oninput="renderGrid()"
      style="width:100%;padding:9px 14px 9px 34px;border-radius:20px;border:none;font-size:14px;font-family:inherit;background:rgba(255,255,255,0.2);color:white;outline:none;">
  </div>
</header>

<nav class="cats-bar"><div class="cats-inner" id="cats"></div></nav>

<main>
  <div class="section-title" id="section-title">Barcha mahsulotlar</div>
  <div class="grid" id="grid"></div>
</main>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-drag"></div>
  <div class="cart-header">
    <h2>🛒 Savat</h2>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <textarea class="note-input" id="order-note" rows="2" placeholder="Izoh: manzil, telefon, yetkazib berish vaqti..."></textarea>
    <div class="cart-total-row">
      <span class="cart-total-label">Jami:</span>
      <span class="cart-total-amount" id="cart-total">0 ₩</span>
    </div>
    <button class="order-btn" onclick="sendToTelegram()">
      ✈️ Telegram orqali buyurtma
    </button>
  </div>
</div>

<script>
// ================================================================
// ✏️ BU YERLARNI O'ZGARTIRING
// ================================================================
const STORE_NAME    = "HanFood Market";
const TELEGRAM_USER = "sizning_username"; // ← faqat username, @ belgisisiz
const CURRENCY      = "₩";

const products = [
  { id:1,  name:"Alpen Gold арахис и хлопья",       unit:"в упаковке 21шт",     price:53550,  oldPrice:0,     emoji:"🍫", image:"Alpen Gold Araxis I Xlopya 80gr.jpg", cat:"Сладости",     tag:"hot"  },
  { id:2,  name:"Alpen Gold чернично-йогуртовая начинка",            unit:"в упаковке 21шт",price:53550, oldPrice:0, emoji:"🍫", image:"Alpen Gold chernika yogurt 80gr.jpg", cat:"Сладости",  tag:"sale" },
  { id:3,  name:"Alpen Gold капучино",         unit:"в упаковке 21шт",           price:53550, oldPrice:0,     emoji:"🍫",image:"Alpen Gold Coppucino 80 gr.jpg", cat:"Сладости",     tag:""     },
  { id:4,  name:"Alpen Gold два шоколада",          unit:"в упаковке 21шт",   price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold dva shokolada 80 gr.jpg", cat:"Сладости",     tag:""     },
  { id:5,  name:"Alpen Gold фундук и изюм",             unit:"в упаковке 21шт",  price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold Funduk I Izyum 80gr.jpg", cat:"Сладости",    tag:"new"  },
  { id:6,  name:"Alpen Gold тёмный", unit:"в упаковке 21шт",          price:53550,  oldPrice:0,     emoji:"🍫", image:"Alpen Gold Gorkiy 80gr.jpg", cat:"Сладости",    tag:""     },
  { id:7,  name:"Alpen Gold клубника-йогурт",        unit:"в упаковке 21шт",              price:53550,  oldPrice:0,     emoji:"🍫", image:"Alpen Gold Klubnika yogurt 80 gr.jpg", cat:"Сладости", tag:"hot"  },
  { id:8,  name:"Alpen Gold миндаль и кокос",         unit:"в упаковке 21шт", price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold Mindal Kokos 80 gr.jpg", cat:"Сладости", tag:""     },
  { id:9,  name:"Alpen Gold молочный",   unit:"в упаковке 21шт",               price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold molochniy 80 gr.jpg", cat:"Сладости'sht",      tag:""     },
  { id:10, name:"Alpen Gold oreo",  unit:"в упаковке 21шт",               price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold Oreo 80gr.jpg", cat:"Сладости",     tag:"hot"  },
  { id:11, name:"Alpen Gold с солёным арахисом и крекером",      unit:"в упаковке 21шт",        price:53550,  oldPrice:0,     emoji:"🍫", image:"Alpen Gold Solyonni Araxis I Kraker 80gr.jpg", cat:"Сладости", tag:"new"  },
  { id:12, name:"Alpen Gold бельый пористый",        unit:"в упаковке 21шт",      price:53550, oldPrice:0,     emoji:"🍫", image:"Alpen Gold Poristi  beliy 80gr.jpg", cat:"Сладости",     tag:""     },
];
// ================================================================

let cart = {};
let activeCat = "Hammasi";
const cats = ["Hammasi", ...new Set(products.map(p => p.cat))];

function initCats() {
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="cat-btn${c===activeCat?' active':''}" onclick="setCat(this,'${c}')">${c}</button>`
  ).join("");
}

function setCat(el, c) {
  activeCat = c;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("section-title").textContent = c === "Hammasi" ? "Barcha mahsulotlar" : c;
  renderGrid();
}

function renderGrid() {
  const q = (document.getElementById("search").value || "").toLowerCase().trim();
  const filtered = products.filter(p =>
    (activeCat === "Hammasi" || p.cat === activeCat) &&
    (!q || p.name.toLowerCase().includes(q) || p.unit.toLowerCase().includes(q))
  );
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">🔍<br><br>Mahsulot topilmadi</div>`;
    return;
  }
  const tagLabel = { hot:"🔥 Mashhur", new:"✨ Yangi", sale:"💥 Chegirma" };
  grid.innerHTML = filtered.map(p => {
    const inCart = (cart[p.id]||0) > 0;
    const tagHtml = p.tag ? `<span class="tag tag-${p.tag}">${tagLabel[p.tag]}</span>` : '';
    const imgContent = p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : p.emoji;
    const oldP = p.oldPrice ? `<span class="old-price">${p.oldPrice.toLocaleString()}</span>` : '';
    return `<div class="card">
      <div class="card-img-wrap" onclick="addToCart(${p.id},true)">${imgContent}${tagHtml}</div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-unit">${p.unit}</div>
        <div class="card-footer">
          <span>${oldP}<span class="price">${p.price.toLocaleString()} ${CURRENCY}</span></span>
          <button class="add-btn${inCart?' in-cart':''}" onclick="addToCart(${p.id})">${inCart?'✓':'+'}</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function addToCart(id, fromImg=false) {
  if (fromImg && (cart[id]||0) > 0) return;
  cart[id] = (cart[id]||0) + 1;
  updateCount(); renderGrid();
}

function changeQty(id, d) {
  cart[id] = (cart[id]||0) + d;
  if (cart[id] <= 0) delete cart[id];
  updateCount(); renderGrid(); renderCart();
}

function updateCount() {
  document.getElementById("cart-count").textContent = Object.values(cart).reduce((a,b)=>a+b,0);
}

function openCart()  {
  document.getElementById("cart-overlay").classList.add("open");
  document.getElementById("cart-panel").classList.add("open");
  renderCart();
}
function closeCart() {
  document.getElementById("cart-overlay").classList.remove("open");
  document.getElementById("cart-panel").classList.remove("open");
}

function renderCart() {
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const itemsEl = document.getElementById("cart-items");
  const footerEl = document.getElementById("cart-footer");
  if (!entries.length) {
    itemsEl.innerHTML = '<div class="cart-empty">🛒<br><br>Savat bo\'sh</div>';
    footerEl.style.display = "none"; return;
  }
  let total = 0;
  itemsEl.innerHTML = entries.map(([id,qty]) => {
    const p = products.find(x=>x.id==id);
    total += p.price * qty;
    const thumb = p.image
      ? `<div class="ci-thumb"><img src="${p.image}" alt="${p.name}"></div>`
      : `<div class="ci-thumb">${p.emoji}</div>`;
    return `<div class="cart-item">${thumb}
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-price">${(p.price*qty).toLocaleString()} ${CURRENCY}</div>
      </div>
      <div class="ci-controls">
        <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
      </div>
    </div>`;
  }).join("");
  document.getElementById("cart-total").textContent = total.toLocaleString() + " " + CURRENCY;
  footerEl.style.display = "block";
}

function sendToTelegram() {
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  if (!entries.length) return;
  let total = 0;
  const lines = entries.map(([id,qty]) => {
    const p = products.find(x=>x.id==id);
    total += p.price * qty;
    return `${p.emoji} ${p.name} × ${qty} — ${(p.price*qty).toLocaleString()} ${CURRENCY}`;
  }).join("\n");
  const note = document.getElementById("order-note").value.trim();
  const msg = `🛍 Yangi buyurtma — ${STORE_NAME}\n\n${lines}\n\n💰 Jami: ${total.toLocaleString()} ${CURRENCY}${note?"\n\n📝 Izoh: "+note:""}`;
  window.open(`https://t.me/${TELEGRAM_USER}?text=${encodeURIComponent(msg)}`, "_blank");
  cart = {}; updateCount(); renderGrid(); closeCart();
}

document.title = STORE_NAME + " — Katalog";
initCats();
renderGrid();
</script>
</body>
</html>
